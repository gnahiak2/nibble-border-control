services:
  border-control:
    build: .
    image: nibble-border-control
    restart: unless-stopped
    # slack tokens, both channel ids, AI_MODEL, and CMD_API_KEY. the api key has to be in .env
    # here: there is no ~/.commandcode/auth.json inside the container to fall back on.
    env_file: .env
    volumes:
      # a named volume, not a host bind mount. docker seeds a fresh volume with the image's
      # directory ownership, so the non-root bun user can always write the interview snapshot.
      # a bind mount inherits the host directory's uid, and the write fails with EACCES.
      - border-data:/app/data
    # no ports: socket mode dials out to slack, nothing listens

volumes:
  border-data:
