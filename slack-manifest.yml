display_information:
  name: border control
  description: greets new arrivals and makes them fill in an entry form
features:
  bot_user:
    display_name: border control
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:read
      - channels:manage
      - groups:write
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - member_joined_channel
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
