display_information:
  name: Nibble Border Control
  description: interviews new arrivals and stamps visas into the approved channel
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: border control
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:read
      - channels:history
      - channels:manage
      - groups:write
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - member_joined_channel
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
